name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit (production deps)
        run: pnpm audit --prod --audit-level=high
      - name: Audit (all deps, informational)
        run: pnpm audit --audit-level=high
        continue-on-error: true

  lint:
    name: Lint (www)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F www lint

  typecheck:
    name: Typecheck (cli)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F create-vllnt-app typecheck

  unit:
    name: Unit Tests
    needs: [setup, lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm -F create-vllnt-app build
      - name: Unit Tests + Coverage
        run: pnpm test:coverage -- --project unit --reporter=verbose

  e2e:
    name: E2E Tests
    needs: [setup, lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm -F create-vllnt-app build
      - name: E2E Tests
        run: pnpm test -- --project e2e --reporter=verbose

  www:
    name: Build + Test (www)
    needs: [setup, lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build www
        run: pnpm -F www build
      - name: Install Playwright
        run: pnpm -F www test:e2e:install
      - name: Smoke Tests
        run: pnpm -F www test:e2e
        env:
          CI: true
