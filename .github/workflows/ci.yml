name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level=high

      - name: Lint (www)
        run: pnpm -F www lint

      - name: Typecheck (cli)
        run: pnpm -F create-vllnt-app typecheck

      - name: Build
        run: pnpm build

      - name: Test + Coverage
        run: pnpm test:coverage
